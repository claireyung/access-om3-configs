collate:
  restart: true
  mpi: true
  walltime: 1:00:00
  mem: 190GB
  ncpus: 16
  queue: normal
  exe: mppnccombine-fast
runlog: true
metadata:
  enable: false

userscripts:
  archive: /usr/bin/bash /g/data/vk83/apps/om3-scripts/payu_config/archive.sh
  error: resub.sh
  run: rm -f resubmit.count

postscript: -v PROJECT,SCRIPTS_DIR=/g/data/vk83/apps/om3-scripts 
  -lstorage=${PBS_NCI_STORAGE}+gdata/xp65 
  /g/data/vk83/apps/om3-scripts/payu_config/postscript.sh

#Model software version
modules:
  use:
  - /g/data/vk83/prerelease/modules
  load:
  - model-tools/mppnccombine-fast/2025.07.000
  - nco/5.0.5
  - access-om3/pr189-18

payu_minimum_version: 1.1.6

platform:
  nodesize: 104
  nodemem: 512

restart_freq: 1YS
