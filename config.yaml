        - /g/data/x77/cy8964/mom6/input/input-8km/17.06.26/chl_globcolour_monthly_clim.nc
        - /g/data/x77/cy8964/mom6/input/input-8km/17.06.26/access-om3-4km-ESMFmesh.nc
