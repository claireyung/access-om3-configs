# Payu configuration

# If submitting to a different project to your default, uncomment line below 
# and change project code as appropriate; also set shortpath below
project: ol01
# Force payu to always find, and save, files in this scratch project directory
shortpath: /scratch/oz91

# Using payu sync is recommend to copy data from ephemeral scratch space to 
# longer term storage
sync:
  enable: false   # set path below and change to true
  path: ##/g/data/ik11/outputs/access-rom3-panan/MC_4km_jra_iaf+regionalpanan+isf         # Set to location on /g/data (e.g. /g/data/PROJECT/USER/EXPERIMENT)
  restart: false

  #Slow/cheaper layout
  #queue: normalsr
  #ncpus: 2990
  #jobfs: 10GB
  #mem: 14700GB

  #Expensive/fast layout
queue: normalsr
ncpus: 4992
jobfs: 10GB
mem: 24576GB

walltime: 5:00:00
jobname: iceshelfpanAn

model: access-om3

exe: access-om3-MOM6-CICE6

input:
        - /g/data/x77/cy8964/mom6/input/input-8km/17.06.26/kmt.nc
        - /g/data/vk83/prerelease/configurations/inputs/access-om3/panan.4km/2026.01.08/ocean_hgrid.nc
        - /g/data/vk83/prerelease/configurations/inputs/access-om3/panan.4km/2026.01.08/ocean_vgrid.nc
        - /g/data/x77/cy8964/mom6/input/input-8km/17.06.26/ocean_temp_salt.res.nc
